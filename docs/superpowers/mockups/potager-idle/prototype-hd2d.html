<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Potager HD-2D</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Pixelify+Sans:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1410;
        font-family: "Cormorant Garamond", Georgia, serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .hud {
        position: fixed;
        pointer-events: none;
        color: #f6ecd2;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.7);
      }
      #banner {
        top: 22px;
        left: 0;
        padding: 10px 70px 12px 34px;
        font:
          italic 700 40px "Cormorant Garamond",
          serif;
        color: #f2e2b0;
        background: linear-gradient(
          90deg,
          rgba(20, 14, 10, 0.85),
          rgba(20, 14, 10, 0.55) 80%,
          rgba(20, 14, 10, 0)
        );
        border-top: 2px solid #b8975a;
        border-bottom: 2px solid #b8975a;
        clip-path: polygon(0 0, 92% 0, 100% 50%, 92% 100%, 0 100%);
      }
      #goal {
        top: 26px;
        right: 32px;
        text-align: right;
        font-weight: 700;
      }
      #goal .lv {
        font-size: 30px;
      }
      #goal .t {
        font-size: 22px;
      }
      #goal .bar {
        width: 260px;
        height: 5px;
        background: rgba(255, 255, 255, 0.18);
        margin: 6px 0 6px auto;
      }
      #goal .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #6fa8d8, #bfe0ff);
        width: 30%;
      }
      #goal .sub {
        font-size: 18px;
        font-weight: 600;
      }
      #goal .sub b {
        font-size: 22px;
        margin-left: 16px;
      }
      #po {
        top: 112px;
        left: 34px;
        font-size: 26px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .coin {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff3b0, #e8b830 55%, #9a6a10);
        box-shadow: 0 0 8px rgba(255, 200, 80, 0.6);
      }
      #staff {
        right: 32px;
        top: 170px;
        width: 260px;
        font-size: 18px;
        font-weight: 600;
      }
      #staff .row {
        display: flex;
        justify-content: space-between;
        padding: 6px 12px;
        margin-bottom: 4px;
        background: linear-gradient(270deg, rgba(20, 14, 10, 0.7), rgba(20, 14, 10, 0));
        border-right: 2px solid #b8975a;
      }
      #staff .row.off {
        opacity: 0.5;
        border-right-color: #6a5a40;
      }
      #staff .st {
        font-size: 15px;
        color: #d8c8a0;
      }
      #hint {
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 22px;
        font-weight: 600;
      }
      .float {
        position: fixed;
        pointer-events: none;
        font:
          500 22px "Pixelify Sans",
          monospace;
        color: #ffe9a0;
        text-shadow:
          0 0 6px rgba(255, 190, 60, 0.9),
          0 2px 0 #5a3a10;
        transform: translate(-50%, -50%);
        transition:
          transform 1.2s ease-out,
          opacity 1.2s ease-in;
      }
    </style>
  </head>
  <body>
    <div id="banner" class="hud">Le Potager</div>
    <div id="goal" class="hud">
      <div class="lv">Niv. 3</div>
      <div class="t">Faire fleurir le potager</div>
      <div class="bar"><i id="goalBar"></i></div>
      <div class="sub">Récolter 10 fleurs. <b id="goalVal">3/10</b></div>
    </div>
    <div id="po" class="hud"><span class="coin"></span><span id="poVal">128</span> PO</div>
    <div id="staff" class="hud">
      <div class="row">
        <span>Arroseur <span class="st">niv. 1</span></span
        ><span class="st" id="staffState">Arrose</span>
      </div>
      <div class="row off"><span>Jardinier</span><span class="st">250 PO</span></div>
      <div class="row off"><span>Cueilleur</span><span class="st">Verrouillé</span></div>
    </div>
    <div id="hint" class="hud">Clique une fleur épanouie pour la cueillir</div>

    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";

      await document.fonts.load('500 8px "Pixelify Sans"').catch(() => {});

      // ---------- aléatoire déterministe ----------
      let seed = 12345;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const pick = (a) => a[Math.floor(rnd() * a.length)];
      const R = (a, b) => a + rnd() * (b - a);

      // ---------- textures pixel art ----------
      const PPU = 16;
      function canvasTex(w, h, draw, repeat = false) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const g = c.getContext("2d");
        draw(g, w, h);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.magFilter = THREE.NearestFilter;
        t.minFilter = THREE.NearestFilter;
        t.generateMipmaps = false;
        if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
      }
      const dot = (g, x, y, c, w = 1, h = 1) => {
        g.fillStyle = c;
        g.fillRect(x, y, w, h);
      };

      function outline(g, w, h, dark = [40, 26, 18]) {
        const img = g.getImageData(0, 0, w, h),
          d = img.data,
          out = new Uint8ClampedArray(d);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (d[i + 3] > 0) continue;
            for (const [dx, dy] of [
              [1, 0],
              [-1, 0],
              [0, 1],
              [0, -1],
            ]) {
              const nx = x + dx,
                ny = y + dy;
              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
              const j = (ny * w + nx) * 4;
              if (d[j + 3] > 0) {
                out[i] = d[j] * 0.35 + dark[0] * 0.4;
                out[i + 1] = d[j + 1] * 0.3 + dark[1] * 0.4;
                out[i + 2] = d[j + 2] * 0.3 + dark[2] * 0.4;
                out[i + 3] = 255;
                break;
              }
            }
          }
        img.data.set(out);
        g.putImageData(img, 0, 0);
      }

      const GRASS = ["#5e8a30", "#6a9636", "#76a23c", "#527c2a", "#82ac44"];
      function grassTop(w, h) {
        return canvasTex(w, h, (g) => {
          for (let y = 0; y < h; y++)
            for (let x = 0; x < w; x++) {
              const n = Math.sin(x * 0.07 + Math.sin(y * 0.05) * 2) + Math.sin(y * 0.09 + x * 0.02);
              const r = rnd();
              dot(
                g,
                x,
                y,
                n > 0.6
                  ? r < 0.5
                    ? GRASS[2]
                    : GRASS[4]
                  : n < -0.8
                    ? r < 0.6
                      ? GRASS[3]
                      : GRASS[0]
                    : r < 0.55
                      ? GRASS[1]
                      : r < 0.8
                        ? GRASS[0]
                        : GRASS[2],
              );
            }
          for (let i = 0; i < (w * h) / 22; i++) {
            const x = Math.floor(R(0, w)),
              y = Math.floor(R(0, h));
            dot(g, x, y, "#9cc458");
            dot(g, x, y + 1, "#486e24");
          }
        });
      }
      function cliffFace(w, h) {
        return canvasTex(w, h, (g) => {
          const cols = ["#6b4a2c", "#5a3c22", "#7a5634", "#4a3018", "#664428"];
          for (let x = 0; x < w; x++) {
            let y = 0;
            while (y < h) {
              const len = Math.floor(R(2, 9));
              dot(g, x, y, pick(cols), 1, len);
              y += len;
            }
          }
          for (let i = 0; i < w / 3; i++) {
            const x = Math.floor(R(0, w)),
              y = Math.floor(R(6, h));
            dot(g, x, y, "#8a6a44", Math.floor(R(2, 5)), 1);
            dot(g, x, y + 1, "#3a2410", Math.floor(R(2, 5)), 1);
          }
          for (let y = h - 6; y < h; y++) {
            g.fillStyle = `rgba(20,10,0,${(y - h + 7) * 0.07})`;
            g.fillRect(0, y, w, 1);
          }
          let len = 4;
          for (let x = 0; x < w; x++) {
            len = Math.max(2, Math.min(9, len + Math.floor(R(-2, 3))));
            for (let y = 0; y < len; y++)
              dot(
                g,
                x,
                y,
                y === 0
                  ? "#9cc458"
                  : y === len - 1
                    ? "#3e6020"
                    : y < 2
                      ? GRASS[2]
                      : pick([GRASS[0], GRASS[1], GRASS[3]]),
              );
          }
        });
      }
      function stoneTex(w, h) {
        return canvasTex(w, h, (g) => {
          dot(g, 0, 0, "#8a8478", w, h);
          for (let y = 0; y < h; y += 5) {
            const off = (y / 5) % 2 ? 4 : 0;
            for (let x = -off; x < w; x += 8) {
              dot(g, x + 1, y + 1, pick(["#a8a090", "#9a9284", "#b4ac9a"]), 6, 3);
              dot(g, x + 1, y + 1, "#c8c0ac", 6, 1);
            }
            dot(g, 0, y, "#5a5448", w, 1);
          }
        });
      }
      function soilTex(w, h) {
        return canvasTex(w, h, (g) => {
          for (let y = 0; y < h; y++) {
            const ph = y % 16;
            const base =
              ph < 3
                ? "#4a2c18"
                : ph < 5
                  ? "#5e3a20"
                  : ph < 11
                    ? "#7a4e2c"
                    : ph < 13
                      ? "#8c5c34"
                      : "#6a4426";
            for (let x = 0; x < w; x++)
              dot(g, x, y, rnd() < 0.12 ? pick(["#5a3820", "#946438", "#3e2412"]) : base);
          }
        });
      }
      function pathTex(
        w,
        h,
        palette = ["#9a7448", "#8a6640", "#a88054", "#7e5a38"],
        edge = "#5e4228",
      ) {
        return canvasTex(w, h, (g) => {
          const m = [];
          for (let y = 0; y < h; y++)
            for (let x = 0; x < w; x++) {
              const ex = Math.min(x, w - 1 - x),
                ey = Math.min(y, h - 1 - y);
              const v =
                Math.min(ex, ey) +
                Math.sin(x * 0.4 + y * 0.13) * 1.6 +
                Math.sin(y * 0.5 - x * 0.2) * 1.4 +
                R(-0.8, 0.8);
              m[y * w + x] = v > 2.5;
            }
          for (let y = 0; y < h; y++)
            for (let x = 0; x < w; x++) {
              if (!m[y * w + x]) continue;
              const border =
                !m[y * w + x + 1] ||
                !m[y * w + x - 1] ||
                !m[(y + 1) * w + x] ||
                !m[(y - 1) * w + x];
              dot(g, x, y, border ? edge : rnd() < 0.08 ? "#c49c6c" : pick(palette));
            }
        });
      }

      // ---------- rendu ----------
      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#c8b48a");
      scene.fog = new THREE.Fog("#c9b892", 30, 62);

      const camera = new THREE.PerspectiveCamera(24, 16 / 9, 1, 120);
      const LOOK = new THREE.Vector3(0, 0.4, -0.6);
      const TILT = THREE.MathUtils.degToRad(33),
        DIST = 27;
      camera.position.set(LOOK.x, LOOK.y + Math.sin(TILT) * DIST, LOOK.z + Math.cos(TILT) * DIST);
      camera.lookAt(LOOK);

      scene.add(new THREE.HemisphereLight("#b8c8e8", "#5a4430", 1.1));
      const sun = new THREE.DirectionalLight("#ffd8a0", 2.6);
      sun.position.set(-12, 18, 9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      Object.assign(sun.shadow.camera, {
        left: -22,
        right: 22,
        top: 22,
        bottom: -22,
        near: 1,
        far: 70,
      });
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.03;
      sun.shadow.radius = 2;
      scene.add(sun);

      const lambert = (map, extra = {}) => new THREE.MeshLambertMaterial({ map, ...extra });

      function block(x0, x1, y0, y1, z0, z1, top = "grass") {
        const w = x1 - x0,
          h = y1 - y0,
          d = z1 - z0;
        const T =
          top === "stone"
            ? stoneTex(Math.round(w * PPU), Math.round(d * PPU))
            : grassTop(Math.round(w * PPU), Math.round(d * PPU));
        const side =
          top === "stone"
            ? (a, b) => stoneTex(Math.round(a * PPU), Math.round(b * PPU))
            : (a, b) => cliffFace(Math.round(a * PPU), Math.round(b * PPU));
        const mats = [
          lambert(side(d, h)),
          lambert(side(d, h)),
          lambert(T),
          lambert(null, { color: "#2a1a10" }),
          lambert(side(w, h)),
          lambert(side(w, h)),
        ];
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
        m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
        m.castShadow = m.receiveShadow = true;
        scene.add(m);
        return m;
      }
      function decal(tex, x0, x1, z0, z1, y = 0.012, extra = {}) {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(x1 - x0, z1 - z0),
          lambert(tex, {
            transparent: true,
            alphaTest: 0.5,
            polygonOffset: true,
            polygonOffsetFactor: -2,
            ...extra,
          }),
        );
        m.rotation.x = -Math.PI / 2;
        m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
        m.receiveShadow = true;
        scene.add(m);
        return m;
      }

      // terrain en terrasses
      block(-22, 22, -3, 0, -4, 4.6);
      block(-22, 22, -3, 2.2, -24, -4);
      block(-22, 22, -7, -3, 4.6, 8.5);
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 20),
        new THREE.MeshLambertMaterial({ color: "#2e5a64" }),
      );
      water.rotation.x = -Math.PI / 2;
      water.position.set(0, -3.4, 17);
      scene.add(water);
      const shimmerTex = canvasTex(
        64,
        64,
        (g) => {
          for (let i = 0; i < 40; i++)
            dot(
              g,
              Math.floor(R(0, 60)),
              Math.floor(R(0, 64)),
              pick(["rgba(190,230,240,0.7)", "rgba(140,200,215,0.6)"]),
              Math.floor(R(2, 6)),
              1,
            );
        },
        true,
      );
      shimmerTex.repeat.set(10, 4);
      const shimmer = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 20),
        new THREE.MeshBasicMaterial({ map: shimmerTex, transparent: true, depthWrite: false }),
      );
      shimmer.rotation.x = -Math.PI / 2;
      shimmer.position.set(0, -3.38, 17);
      scene.add(shimmer);

      // chemins
      decal(pathTex(28 * PPU, 22), -14, 14, 2.1, 3.5);
      decal(pathTex(20, 4 * PPU), -5.4, -4.15, -1.5, 2.4);
      decal(pathTex(16 * PPU, 20), -10, 6, -7.4, -6.1, 2.212);

      // escalier de pierre vers le plateau
      for (let k = 1; k <= 5; k++) block(-11, -9.4, 0, k * 0.44, -4, -4 + (6 - k) * 0.5, "stone");

      // ---------- sprites ----------
      function spriteMesh(tex, w, h, opts = {}) {
        const geo = new THREE.PlaneGeometry(w, h);
        geo.translate(0, h / 2, 0);
        const m = new THREE.Mesh(
          geo,
          new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide }),
        );
        m.castShadow = opts.cast !== false;
        m.receiveShadow = true;
        return m;
      }
      function treeTex(palette) {
        return canvasTex(48, 64, (g) => {
          dot(g, 21, 38, "#6a4426", 6, 26);
          dot(g, 21, 38, "#8a5c34", 2, 26);
          dot(g, 25, 38, "#4a2c18", 2, 26);
          dot(g, 18, 60, "#5a3820", 12, 4);
          const blobs = [
            [24, 22, 15],
            [14, 30, 10],
            [34, 29, 11],
            [24, 12, 10],
            [20, 34, 9],
            [30, 36, 8],
          ];
          for (let y = 0; y < 48; y++)
            for (let x = 0; x < 48; x++) {
              let inside = false,
                shade = 0;
              for (const [cx, cy, r] of blobs) {
                const dx = x - cx,
                  dy = y - cy,
                  dd = dx * dx + dy * dy;
                if (dd < r * r) {
                  inside = true;
                  shade = Math.max(shade, (-dx - dy) / r);
                }
              }
              if (!inside) continue;
              const k = shade + R(-0.35, 0.35);
              dot(
                g,
                x,
                y,
                k > 0.55 ? palette[3] : k > 0.1 ? palette[2] : k > -0.4 ? palette[1] : palette[0],
              );
            }
          outline(g, 48, 64);
        });
      }
      const treePalettes = [
        ["#8a2a18", "#c04424", "#e0702e", "#f6a848"],
        ["#9a4a14", "#d07a20", "#eaa230", "#f8d060"],
        ["#2e5a24", "#447a2c", "#5e9a34", "#8cc04a"],
        ["#7a2a2a", "#a83a2a", "#d0583a", "#ee8a50"],
      ];
      const treeTexs = treePalettes.map(treeTex);
      function bushTex(p) {
        return canvasTex(32, 20, (g) => {
          for (let y = 0; y < 20; y++)
            for (let x = 0; x < 32; x++) {
              const blobs = [
                [9, 12, 8],
                [18, 9, 9],
                [25, 13, 7],
              ];
              let shade = -9;
              for (const [cx, cy, r] of blobs) {
                const dx = x - cx,
                  dy = y - cy;
                if (dx * dx + dy * dy < r * r) shade = Math.max(shade, (-dx - dy) / r);
              }
              if (shade === -9) continue;
              const k = shade + R(-0.3, 0.3);
              dot(g, x, y, k > 0.5 ? p[3] : k > 0 ? p[2] : k > -0.5 ? p[1] : p[0]);
            }
          outline(g, 32, 20);
        });
      }
      const bushT = [bushTex(treePalettes[2]), bushTex(treePalettes[0])];
      const tuftTex = canvasTex(8, 8, (g) => {
        [
          [1, 3],
          [3, 1],
          [4, 2],
          [6, 3],
          [2, 2],
        ].forEach(([x, top]) => {
          for (let y = top; y < 8; y++)
            dot(g, x, y, y === top ? "#a6cc5c" : y > 5 ? "#3e6020" : "#6a9a36");
        });
      });
      const tuftTex2 = canvasTex(8, 8, (g) => {
        [
          [1, 4],
          [2, 2],
          [4, 1],
          [5, 3],
          [6, 4],
        ].forEach(([x, top]) => {
          for (let y = top; y < 8; y++)
            dot(g, x, y, y === top ? "#d8c070" : y > 5 ? "#6a6020" : "#a89a44");
        });
      });

      function place(m, x, y, z) {
        m.position.set(x, y, z);
        scene.add(m);
        return m;
      }
      [
        [-15, -6.5, 0, 4.2],
        [-7.5, -9, 1, 4.8],
        [-1.5, -8, 3, 4.2],
        [4.5, -10, 0, 5.2],
        [10, -7, 1, 4.4],
        [15.5, -9.5, 3, 5],
        [-12, -13, 2, 5.4],
        [1.5, -14, 1, 5.6],
        [8, -15, 0, 5.8],
        [-4, -16, 3, 5.4],
      ].forEach(([x, z, p, s]) => place(spriteMesh(treeTexs[p], s * 0.75, s), x, 2.2, z));
      [
        [-13, -3.4],
        [-8, -3.3],
        [8.5, -3.2],
        [12.5, -3.4],
        [-12.5, 3.8],
        [10.5, 4.0],
        [-1.6, -3.3],
      ].forEach(([x, z], i) => place(spriteMesh(bushT[i % 3 === 2 ? 1 : 0], 2, 1.25), x, 0, z));
      for (let i = 0; i < 260; i++) {
        const x = R(-16, 16),
          z = R(-4, 4.4);
        if (x > 0.4 && x < 7.6 && z > -2 && z < 1.9) continue;
        if (x > -7.4 && x < -3.1 && z < -1.2) continue;
        if (z > 2 && z < 3.6) continue;
        place(spriteMesh(rnd() < 0.8 ? tuftTex : tuftTex2, 0.5, 0.5, { cast: false }), x, 0, z);
      }
      for (let i = 0; i < 120; i++)
        place(
          spriteMesh(rnd() < 0.7 ? tuftTex : tuftTex2, 0.5, 0.5, { cast: false }),
          R(-16, 16),
          2.2,
          R(-12, -4.3),
        );

      // barrière du plateau
      const woodMat = new THREE.MeshLambertMaterial({ color: "#7a5434" });
      for (let x = -8.5; x <= 16; x += 1.6) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.9, 0.14), woodMat);
        p.castShadow = true;
        place(p, x, 2.65, -4.35);
      }
      [2.55, 2.9].forEach((y) => {

      const rtA = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });

      const quadVS =
        "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
      const blurMat = new THREE.ShaderMaterial({
        uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2() } },
        vertexShader: quadVS,
        fragmentShader: `uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;
    void main() {
      vec3 c = texture2D(tex, vUv).rgb * 0.227;
      c += (texture2D(tex, vUv + dir * 1.385).rgb + texture2D(tex, vUv - dir * 1.385).rgb) * 0.316;
      c += (texture2D(tex, vUv + dir * 3.231).rgb + texture2D(tex, vUv - dir * 3.231).rgb) * 0.070;
      gl_FragColor = vec4(c, 1.0);
    }`,
      });
      const finalMat = new THREE.ShaderMaterial({
        uniforms: { tSharp: { value: rtMain.texture }, tBlur: { value: rtB.texture } },
        vertexShader: quadVS,
        fragmentShader: `uniform sampler2D tSharp; uniform sampler2D tBlur; varying vec2 vUv;
    void main() {
      vec3 s = texture2D(tSharp, vUv).rgb;
      vec3 b = texture2D(tBlur, vUv).rgb;
      float f = smoothstep(0.1, 0.42, abs(vUv.y - 0.44));
      vec3 col = mix(s, b, f);
      col += max(b - vec3(0.5), 0.0) * 1.1;
      col = col * vec3(1.06, 1.0, 0.9) + vec3(0.0, 0.012, 0.035) * (1.0 - col);
      float v = smoothstep(0.32, 0.95, length((vUv - 0.5) * vec2(1.0, 1.3)));
      col *= 1.0 - v * 0.65;
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
      });
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
      const postScene = new THREE.Scene();
      postScene.add(quad);
      const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      function pass(mat, target) {

        renderer.render(postScene, postCam);

      function resize() {
        const dpr = Math.min(devicePixelRatio, 1.5);
        const w = Math.round(innerWidth * dpr),
          h = Math.round(innerHeight * dpr);
        renderer.setSize(w, h, false);
        rtMain.setSize(w, h);
        rtA.setSize(Math.ceil(w / 4), Math.ceil(h / 4));
        rtB.setSize(Math.ceil(w / 4), Math.ceil(h / 4));
        camera.aspect = w / h;
        camera.fov = camera.aspect < 1.3 ? 34 : 24;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();

      // ---------- jeu ----------
      let po = 128,
        harvested = 3;
      const poVal = document.getElementById("poVal"),
        goalVal = document.getElementById("goalVal"),
        goalBar = document.getElementById("goalBar"),
        staffState = document.getElementById("staffState");
      const GROW = 7;
      let task = null,
        waterT = 0,
        frameT = 0,
        frame = 0,
        facing = 1;

      function harvest(s) {
        if (s.stage !== 3 || s.pop) return;
        s.pop = 0.0001;
        const gain = 8 + Math.floor(Math.random() * 10);
        const p = new THREE.Vector3(s.x, 1.4, s.z).project(camera);
        const el = document.createElement("div");
        el.className = "float";
        el.textContent = `+${gain} PO`;
        el.style.left = `${(p.x * 0.5 + 0.5) * innerWidth}px`;
        el.style.top = `${(-p.y * 0.5 + 0.5) * innerHeight}px`;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
          el.style.transform = "translate(-50%, -170%)";
          el.style.opacity = "0";
        });
        setTimeout(() => el.remove(), 1300);
        po += gain;
        harvested = Math.min(10, harvested + 1);
        poVal.textContent = po;
        goalVal.textContent = `${harvested}/10`;
        goalBar.style.width = `${harvested * 10}%`;
      }
      const ray = new THREE.Raycaster(),
        ptr = new THREE.Vector2();
      function hit(e) {
        ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        ray.setFromCamera(ptr, camera);
        return (
          ray
            .intersectObjects(targets, false)
            .map((h) => h.object.userData.spot)
            .find((s) => s.stage === 3) || null
        );
      }
      renderer.domElement.addEventListener("pointermove", (e) => {
        renderer.domElement.style.cursor = hit(e) ? "pointer" : "default";
      });
      renderer.domElement.addEventListener("click", (e) => {
        const s = hit(e);
        if (s) harvest(s);
      });

      const clock = new THREE.Clock();
      function tick() {
        const dt = Math.min(clock.getDelta(), 0.05),
          t = clock.elapsedTime;

        for (const s of spots) {
          s.wet = Math.max(0, s.wet - dt / 25);
          s.wetDecal.material.opacity = Math.min(0.75, s.wet);
          if (s.pop) {
            s.pop += dt * 3.2;
            const k = s.pop < 0.25 ? 1 + s.pop * 1.2 : Math.max(0, 1.3 - (s.pop - 0.25) * 2.4);
            s.m.scale.set(k, k, 1);
            if (k <= 0) {
              s.pop = 0;
              s.stage = 0;
              s.t = 0;
              s.m.scale.set(1, 1, 1);
              refresh(s);
            }
          } else if (s.stage < 3) {
            s.t += dt * (1 + s.wet * 1.5);
            if (s.t > GROW) {
              s.t = 0;
              s.stage++;
              refresh(s);
              s.m.scale.set(1, 0.6, 1);
            }
          }
          if (!s.pop && s.m.scale.y < 1) s.m.scale.y = Math.min(1, s.m.scale.y + dt * 3);
          s.m.rotation.z = Math.sin(t * 1.5 + s.phase) * 0.04;
        }

        if (!task) {
          const dry = spots.filter((s) => s.wet < 0.2 && s.stage > 0 && s.stage < 3);
          const pool = dry.length ? dry : spots.filter((s) => s.wet < 0.3);
          task = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
          waterT = 0;
        }
        if (task) {
          const tx = task.x - 0.75,
            tz = task.z + 0.3;
          const dx = tx - gardener.position.x,
            dz = tz - gardener.position.z,
            dist = Math.hypot(dx, dz);
          if (dist > 0.05) {
            const step = Math.min(dist, dt * 1.9);
            gardener.position.x += (dx / dist) * step;
            gardener.position.z += (dz / dist) * step;
            if (Math.abs(dx) > 0.05) facing = Math.sign(dx);
            frameT += dt;
            if (frameT > 0.16) {
              frameT = 0;
              frame ^= 1;
              gardener.material.map = frames[frame];
            }
            gardener.position.y = frame ? 0.04 : 0;
            staffState.textContent = "Va vers une plante";
          } else {
            facing = 1;
            gardener.material.map = frames[0];
            gardener.position.y = 0;
            waterT += dt;
            if (waterT > 0.3) {
              for (const d of drops) {
                if (d.life > 0) continue;
                d.life = R(0.35, 0.6);
                d.s.visible = true;
                d.s.position.set(gardener.position.x + 0.62, 0.95, gardener.position.z + 0.02);
                d.v.set(R(0.6, 1.3), R(0.2, 0.9), R(-0.2, 0.2));
                if (Math.random() < 0.65) break;
              }
            }
            task.wet = Math.min(1, task.wet + dt * 0.5);
            staffState.textContent = "Arrose";
            if (waterT > 2.2) task = null;
          }
          gardener.scale.x = facing;
        }

        for (const d of drops) {
          if (d.life <= 0) continue;
          d.life -= dt;
          d.v.y -= 9 * dt;
          d.s.position.addScaledVector(d.v, dt);
          if (d.life <= 0 || d.s.position.y < 0.2) {
            d.life = 0;
            d.s.visible = false;
          }
        }
        for (let i = 0; i < 90; i++) {
          motePos[i * 3 + 1] += dt * 0.12;
          motePos[i * 3] += Math.sin(t * 0.5 + i) * dt * 0.1;
          if (motePos[i * 3 + 1] > 5.5) motePos[i * 3 + 1] = 0.2;
        }
        moteGeo.attributes.position.needsUpdate = true;
        for (const l of leaves) {
          l.s.position.y -= l.sp * dt;
          l.s.position.x += Math.sin(t * 1.3 + l.ph) * dt * 0.7 + dt * 0.3;
          l.s.material.rotation = Math.sin(t * 2 + l.ph) * 1.5;
          if (l.s.position.y < 0.05) l.reset(false);
        }
        shimmerTex.offset.x = t * 0.01;
        shimmerTex.offset.y = Math.sin(t * 0.4) * 0.02;
        lantern.intensity = 3 + Math.sin(t * 7) * 0.4 + Math.sin(t * 13) * 0.3;
        lockSign.rotation.z = Math.sin(t * 2) * 0.02;

        renderer.setRenderTarget(rtMain);
        renderer.render(scene, camera);
        blurMat.uniforms.tex.value = rtMain.texture;
        blurMat.uniforms.dir.value.set(1 / rtA.width, 0);
        pass(blurMat, rtA);
        blurMat.uniforms.tex.value = rtA.texture;
        blurMat.uniforms.dir.value.set(0, 1 / rtA.height);
        pass(blurMat, rtB);
        pass(finalMat, null);
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
