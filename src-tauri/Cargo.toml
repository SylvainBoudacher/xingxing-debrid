[package]
name = "c411-debrid-app"
version = "1.6.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "c411_debrid_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# rustls et pas native-tls : sur macOS, Secure Transport echoue le handshake avec
# l'edge Cloudflare de MangaDex ("bad protocol version"). Le feature native-tls
# etait aussi unifie dans le client de tauri-plugin-http, qui echouait pareil.
reqwest = { version = "0.12", features = ["multipart", "json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
keyring = "4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
